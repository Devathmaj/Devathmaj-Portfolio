name = "devathmaj"
pages_build_output_dir = "_site"
compatibility_date = "2026-10-31"
compatibility_flags = ["nodejs_compat"]

# Secrets (RESEND_API_KEY, TURNSTILE_SECRET_KEY, CONTACT_TO_EMAIL and signing
# secrets) are managed in Cloudflare Pages. The sender is a production variable.
# Local values belong in the git-ignored .dev.vars file.

[vars]
CONTACT_ALLOWED_ORIGIN = "https://devathmaj.me"
CONTACT_ALLOWED_HOSTNAME = "devathmaj.me"

[[durable_objects.bindings]]
name = "CONTACT_LIMITER"
class_name = "ContactRateLimitShard"
script_name = "portfolio-contact-limiter"

# Pages variables/bindings are non-inheritable when overriding an environment.
[env.production.vars]
CONTACT_ALLOWED_ORIGIN = "https://devathmaj.me"
CONTACT_ALLOWED_HOSTNAME = "devathmaj.me"
CONTACT_FROM_EMAIL = "Portfolio Contact <contact@devathmaj.me>"

[[env.production.durable_objects.bindings]]
name = "CONTACT_LIMITER"
class_name = "ContactRateLimitShard"
script_name = "portfolio-contact-limiter"

# Preserve the existing dashboard preview build variable. Non-inheritable
# bindings/vars are repeated explicitly when overriding a Pages environment.
[env.preview.vars]
NODE_VERSION = "22"
CONTACT_ALLOWED_ORIGIN = "https://devathmaj.me"
CONTACT_ALLOWED_HOSTNAME = "devathmaj.me"

[[env.preview.durable_objects.bindings]]
name = "CONTACT_LIMITER"
class_name = "ContactRateLimitShard"
script_name = "portfolio-contact-limiter"
