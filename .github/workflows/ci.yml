name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 00:30 UTC — matches the Dependabot window (06:00 Asia/Kolkata).
    - cron: "30 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # --ignore-scripts: this job only reads the lockfile and package
      # signatures, so the postinstall patches are unnecessary here.
      - name: Install
        run: npm ci --ignore-scripts

      # The gate. Fails the job on any high or critical advisory in the tree
      # that actually ships. Currently at zero.
      - name: Audit production dependencies (fail on high or critical)
        run: npm audit --omit=dev --audit-level=high

      # Same threshold for the whole tree: build tooling is where every
      # advisory in this project has landed so far. The three accepted
      # low-severity deepmerge findings do not trip this — do not switch to a
      # plain `npm audit`, which exits non-zero on any severity and would make
      # CI permanently red.
      - name: Audit all dependencies (fail on high or critical)
        run: npm audit --audit-level=high

      # Advisory only — deliberately non-blocking.
      #
      # npm resolves the signing keys per run from the registry, then aborts the
      # whole audit with EMISSINGSIGNATUREKEY when that response does not carry
      # the key an attestation was signed with. It reports this as a package
      # problem even when the package is fine, and the code path rethrows
      # instead of collecting the error like it does for other verification
      # failures, so one blip kills the entire run.
      #
      # Observed here: `main` and four Dependabot branches all pinned the same
      # @babel/plugin-transform-block-scoping@7.29.12; two passed and one failed
      # on the same runner pool within the same minute. The same tree verifies
      # 694/694 locally, including with an empty npm cache. That is
      # non-deterministic registry behaviour, not a supply-chain finding.
      #
      # Retries absorb the transient case; continue-on-error stops a registry
      # hiccup from turning the pipeline red. The two `npm audit` steps above
      # remain the actual security gates.
      - name: Verify registry signatures and provenance (advisory)
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            if npm audit signatures; then
              exit 0
            fi
            echo "::warning::npm audit signatures failed (attempt ${attempt}/3)"
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done
          echo "::warning::Signature verification did not complete. This is a known npm/registry flake and does not block the build; see the log above."
          exit 1

      - name: Write audit summary
        if: always()
        run: |
          npm audit --json > audit.json || true
          REPORT="$(node .github/scripts/audit-summary.mjs audit.json)"
          echo "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          echo "$REPORT"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit.json
          if-no-files-found: ignore
          retention-days: 30

  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Runs postinstall: the Taxi patch plus the build-id stamp.
      - name: Install
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Contact stack tests
        run: npm run test:contact
